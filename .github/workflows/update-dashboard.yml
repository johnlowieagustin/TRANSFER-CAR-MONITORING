on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install pandas openpyxl

      - name: Download Excel from OneDrive
        env:
          EXCEL_URL: ${{ secrets.ONEDRIVE_EXCEL_URL }}
        run: |
          curl -fL "$EXCEL_URL" -o inventory.xlsx

      - name: Convert Excel sheets to JSON
        run: |
          python - <<'PY'
          import pandas as pd
          import json

          sheets = pd.read_excel(
              "inventory.xlsx",
              sheet_name=None
          )

          data = {}

          for name, df in sheets.items():
              data[name] = json.loads(
                  df.to_json(
                      orient="records",
                      date_format="iso"
                  )
              )

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print("Excel successfully converted to JSON.")
          PY

      - name: Save updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Automatically update dashboard data"
            git push
          fi
